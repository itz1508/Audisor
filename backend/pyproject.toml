[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audisor-local"
version = "0.9.0"
description = "Evidence-first local inspection tools for Codex and compatible callers"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["Pillow>=10,<12", "PyYAML>=6.0,<7", "jsonschema>=4.20,<5", "mcp>=1.27,<2"]

[project.scripts]
audisor = "audisor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/audisor"]

[tool.hatch.build.targets.wheel.force-include]
"src/audisor/schemas/v1/llm-statement.schema.json" = "audisor/schemas/v1/llm-statement.schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
